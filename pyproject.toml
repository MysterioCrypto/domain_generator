[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-generator"
version = "0.1.0.dev0"
description = "Deterministic procedural domain generation core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "shapely==2.1.2",
]

[project.optional-dependencies]
render = [
  "matplotlib>=3.9,<4",
]
dev = [
  "pytest>=8,<9",
  "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
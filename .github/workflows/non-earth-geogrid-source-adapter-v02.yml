          cp -r src scripts examples "$RUNNER_TEMP/p4b-public-source-snapshot/"
          cp pyproject.toml "$RUNNER_TEMP/p4b-public-source-snapshot/"
          echo "Public source checkout — no original A8/A12" > "$RUNNER_TEMP/p4b-public-source-snapshot/README-snapshot.txt"

      - name: Publish public code snapshot only (not private planet arrays)
        uses: actions/upload-artifact@v4

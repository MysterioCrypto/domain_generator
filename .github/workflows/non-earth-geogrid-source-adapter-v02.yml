name: non-earth-geogrid-source-adapter-v02
on:
  push:
    branches: [feature/v0.2-planetary-geogrid-source-adapter]
  pull_request:
    paths:
      - scripts/export_planetary_macro_region_v02.py
      - tests/test_planetary_geogrid_source_adapter_v02.py
      - scripts/condition_planetary_child_terrain_v02.py
      - tests/test_planetary_child_terrain_v02.py
      - scripts/diagnose_planetary_child_mfd_v02.py
      - scripts/audit_planetary_child_lakes_v02.py
      - tests/test_planetary_child_lakes_v02.py
      - scripts/condition_planetary_child_boundary_mfd_v02.py
      - tests/test_planetary_boundary_inflow_mfd_v02.py
      - scripts/trace_a8_external_first_entry_v02.py
      - tests/test_a8_external_first_entry_v02.py
      - scripts/compare_planetary_child_mfd_outlets_v02.py
      - scripts/render_region_drainage_evidence_v02.py
      - scripts/reconcile_region_boundary_corridors_v02.py
      - scripts/audit_region_corridor_sensitivity_v02.py
      - scripts/audit_region_anchor_alternative_drains_v02.py
      - scripts/compare_region_relief_strength_v02.py
      - tests/test_region_relief_strength_compare_v02.py
      - scripts/compare_region_mfd_variant_basins_v02.py
      - tests/test_region_mfd_variant_basins_v02.py
      - scripts/compare_region_channel_scale_v02.py
      - tests/test_region_channel_scale_v02.py
      - scripts/diagnose_region_directional_bias_v02.py
      - tests/test_region_directional_bias_v02.py
      - tests/test_region_anchor_alternative_drains_v02.py
      - tests/test_region_corridor_sensitivity_v02.py
      - tests/test_region_boundary_corridors_v02.py
      - scripts/render_region_cartographic_base_v02.py
      - tests/test_region_drainage_evidence_v02.py
      - tests/test_planetary_child_mfd_outlet_alignment_v02.py
      - scripts/propose_planetary_river_corridor_v02.py
      - tests/test_planetary_source_corridor_trial_v02.py
      - scripts/diagnose_planetary_child_lake_topology_v02.py
      - tests/test_planetary_child_lake_topology_v02.py
      - tests/test_planetary_child_mfd_diagnostic_v02.py
      - .github/workflows/non-earth-geogrid-source-adapter-v02.yml
permissions:
  contents: read
jobs:
  source-align-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and rendering environment
        run: python -m pip install -e ".[dev,render]"
      - name: Test source alignment and geographic graph boundary invariants
        run: python -m pytest tests/test_planetary_geogrid_source_adapter_v02.py tests/test_planetary_child_terrain_v02.py tests/test_planetary_child_mfd_diagnostic_v02.py tests/test_planetary_child_lakes_v02.py tests/test_planetary_boundary_inflow_mfd_v02.py tests/test_a8_external_first_entry_v02.py tests/test_planetary_child_mfd_outlet_alignment_v02.py tests/test_planetary_source_corridor_trial_v02.py tests/test_planetary_child_lake_topology_v02.py tests/test_region_drainage_evidence_v02.py tests/test_region_boundary_corridors_v02.py tests/test_region_corridor_sensitivity_v02.py tests/test_region_anchor_alternative_drains_v02.py tests/test_region_relief_strength_compare_v02.py tests/test_region_mfd_variant_basins_v02.py tests/test_region_channel_scale_v02.py tests/test_region_directional_bias_v02.py -q
      - name: Create SMALL synthetic source archives (NO PRIVATE PLANET DATA)
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import numpy as np
          import os
          from zipfile import ZipFile
          root = Path(os.environ["RUNNER_TEMP"]) / "synthetic-world"
          root.mkdir()
          lat = np.round(np.arange(-1.5, 1.5001, 0.3), 2).astype("float32")
          lon = np.round(np.arange(-3, 3.0001, 0.3), 2).astype("float32")
          rows, cols = len(lat), len(lon)
          X, Y = np.meshgrid(lon, lat)
          elevation = (380 + 150 * np.sin(X * 1.4) +
                       300 * np.exp(-((X - 1) ** 2 + (Y + 0.3) ** 2)) -
                       130 * np.cos(Y * 1.3)).astype("float32")
          land = np.ones((rows, cols), dtype="uint8")
          land[-2:, -3:] = 0
          north_elev = elevation[::-1].copy()
          north_land = land[::-1].copy()
          downstream = np.full((rows, cols), -1, dtype="int32")
          for row in range(rows - 1):
              downstream[row] = np.arange((row + 1) * cols, (row + 2) * cols)
          # Real original A8 D8 does not route FROM ocean cells; the toy must agree.
          downstream[north_land == 0] = -1
          for name, member, fields in (
              ("A8", "planet_A8/A8_hydrology.npz", {
                  "lat": lat[::-1], "lon": lon,
                  "land": north_land, "elevation_m": north_elev,
                  "downstream_index": downstream,
                  "catchment_area_km2": np.abs(1 + 20 * X + 50 * Y).astype("float32"),
                  "river_mask": np.asarray(np.abs(X) < 0.2, dtype="uint8"),
              }),
              ("A12", "planet_A12/A12_biome_fields.npz", {
                  "lat": lat, "lon": lon, "land": land, "elevation_m": elevation,
                  "temperature_annual_C": np.full_like(elevation, 15),
                  "precip_planet_year_mm": np.full_like(elevation, 870),
                  "biome_base": np.full_like(land, 7),
              }),
              ("A10", "planet_A10/A10_water_balance.npz", {
                  "lat": lat, "lon": lon, "land": land,
                  "annual_Q_m3s": np.full_like(elevation, 50),
              }),
          ):
              data = BytesIO()
              np.savez_compressed(data, **fields)
              with ZipFile(root / f"{name}.zip", "w") as z:
                  z.writestr(member, data.getvalue())
          print("Synthetic input only:", [f.name for f in root.iterdir()])
          PY
      - name: Produce synthetic macro-region and preserve source graph boundary
        run: |
          python scripts/export_planetary_macro_region_v02.py \
            --a8 "$RUNNER_TEMP/synthetic-world/A8.zip" \
            --a12 "$RUNNER_TEMP/synthetic-world/A12.zip" \
            --a10 "$RUNNER_TEMP/synthetic-world/A10.zip" \
            --lat 0.0 --lon 0.0 \
            --half-width-km 180 --half-height-km 130 \
            --planet-radius-km 7008.1 \
            --planet-year-earth-days 202.755 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint"
      - name: Verify north-first raster, graph exits and output PNG
        run: |
          python - <<'PY'
          import json, os
          import numpy as np
          from pathlib import Path
          from PIL import Image
          out = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint"
          r = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          assert not r["is_DomainData"]
          assert r["source_precip_unit"] == "mm per planetary year"
          assert r["global_D8_receiver_index_preserved"]
          assert r["local_D8_exits_region_count"] > 0
          assert r["planet_radius_km"] == 7008.1
          with np.load(out / "macro-region-source.npz", allow_pickle=False) as f:
              assert f["elevation_m"].shape == tuple(r["region_shape"])
              assert f["latitude_deg_north_first"][0] > f["latitude_deg_north_first"][-1]
              assert np.any(f["source_downstream_exits_region"])
          with Image.open(out / "macro-region-preview.png") as image:
              assert image.width > 800 and image.height > 300
          print("SOURCE ADAPTER OK: aligned source raster, cropped D8 boundary noted")
          PY
      - name: Generate NEW 1-km child relief from synthetic macro source
        run: |
          python scripts/condition_planetary_child_terrain_v02.py \
            --macro-npz "$RUNNER_TEMP/source-geogrid-checkpoint/macro-region-source.npz" \
            --macro-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/manifest.json" \
            --lat 0 --lon 0 \
            --half-width-km 85 --half-height-km 65 --spacing-km 1 \
            --seed 1406 --relief-strength 2 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/child"

      - name: Verify exact source anchors, nontrivial detail and new PNG
        run: |
          python - <<'PY'
          import json, os
          import numpy as np
          from pathlib import Path
          from PIL import Image
          path = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint" / "child"
          note = json.loads((path / "manifest.json").read_text(encoding="utf-8"))
          assert note["is_accepted_Core_DomainData"] is False
          assert note["max_parent_anchor_error_m"] < 1e-6
          assert note["source_elevation_anchors_in_child"] >= 6
          assert note["planet_year_earth_days"] == 202.755
          with np.load(path / "child-terrain-generated.npz", allow_pickle=False) as arr:
              assert arr["child_elevation_m"].shape == tuple(note["child_shape"])
              assert np.max(np.abs(arr["new_local_relief_m"])) > 1
              assert np.array_equal(arr["child_elevation_m"] >= 0,
                                    arr["parent_interpolated_m"] >= 0)
          with Image.open(path / "child-terrain-preview.png") as png:
              assert png.width > 800
          print("NON-EARTH CHILD: synthetic relief nontrivial; parent anchors exact")
          PY
      - name: Run accepted Core MFD on NEW child terrain and audit source D8 guide
        run: |
          python scripts/diagnose_planetary_child_mfd_v02.py \
            --child-npz "$RUNNER_TEMP/source-geogrid-checkpoint/child/child-terrain-generated.npz" \
            --child-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/child/manifest.json" \
            --macro-npz "$RUNNER_TEMP/source-geogrid-checkpoint/macro-region-source.npz" \
            --threshold-km2 15 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/child-mfd"

      - name: Verify MFD conservation and visibly distinguish NEW flow from historical D8
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          from PIL import Image
          folder = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint" / "child-mfd"
          note = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
          assert note["status"].startswith("P2_B_DIAGNOSTIC")
          assert note["parent_child_consistency"].startswith("NOT YET ENFORCED")
          assert note["source_reference"]["source_d8_visible_river_links"] > 0
          assert note["outlets"]["boundary_inflow_missing"]
          assert not note["child_MFD"]["lake_and_marine_handling"].startswith("IMPLEMENTED")
          assert abs(note["mass_ledger"]["relative_balance_error"]) < 1e-9
          with np.load(folder / "child-mfd-diagnostic.npz", allow_pickle=False) as field:
              assert field["child_MFD_accumulation_km2"].shape == (131, 171)
              assert field["child_MFD_major_channel_support_mask"].sum() > 0
          with Image.open(folder / "child-mfd-comparison.png") as image:
              assert image.width > 1000 and image.height > 400
          print("P2-B MFD DIAGNOSTIC OK: mass conserved, D8 only source guide, no fake inflow")
          PY

      - name: P2-B2.1 review provisional basins, NOT actual lakes
        run: |
          python scripts/audit_planetary_child_lakes_v02.py \
            --child-npz "$RUNNER_TEMP/source-geogrid-checkpoint/child/child-terrain-generated.npz" \
            --child-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/child/manifest.json" \
            --lake-min-area-km2 4 --lake-min-depth-m 2 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/child-lake-review"

      - name: Confirm basin mask and spill evidence without false water claims
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          from PIL import Image

          folder = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint" / "child-lake-review"
          m = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
          assert m["status"] == "P2_B2_1_GEOMETRIC_PROSPECTIVE_LAKES_NOT_WATER_OCCUPANCY"
          assert not m["physical_water_coverage_inferred"]
          assert m["author_approved_lakes"] == 0
          assert not m["external_macro_inflow_used"]
          assert not m["macro_A8_D8_forced"]
          assert m["threshold_qualified_cells"] <= m["fill_required_cells"]
          assert m["candidate_spill_count"] <= m["threshold_qualified_basins"]
          with np.load(folder / "child-lake-basin-review.npz", allow_pickle=False) as data:
              assert data["required_fill_depth_m"].shape == (131, 171)
              assert data["provisional_lake_basin_id"].shape == (131, 171)
          with Image.open(folder / "child-lake-basin-review.png") as im:
              assert im.width > 1000 and im.height > 400
          print("P2-B2.1 SOURCE CHILD: provisional basins only, no water inference")
          PY

      - name: Sensitivity review (do not install universal lake thresholds)
        run: |
          python scripts/audit_planetary_child_lakes_v02.py \
            --child-npz "$RUNNER_TEMP/source-geogrid-checkpoint/child/child-terrain-generated.npz" \
            --child-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/child/manifest.json" \
            --lake-min-area-km2 16 --lake-min-depth-m 10 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/child-lake-strict-review"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageOps, ImageDraw

          base = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint"
          loose = base / "child-lake-review"
          strict = base / "child-lake-strict-review"
          a = json.loads((loose / "manifest.json").read_text(encoding="utf-8"))
          b = json.loads((strict / "manifest.json").read_text(encoding="utf-8"))
          with np.load(loose / "child-lake-basin-review.npz", allow_pickle=False) as d1, \
               np.load(strict / "child-lake-basin-review.npz", allow_pickle=False) as d2:
              mask_a = d1["provisional_lake_basin_id"] > 0
              mask_b = d2["provisional_lake_basin_id"] > 0
              assert not np.any(mask_b & ~mask_a)
              np.testing.assert_array_equal(
                  d1["required_fill_depth_m"], d2["required_fill_depth_m"]
              )
          assert b["threshold_qualified_basins"] <= a["threshold_qualified_basins"]
          assert b["threshold_qualified_cells"] <= a["threshold_qualified_cells"]
          assert not b["physical_water_coverage_inferred"]
          canvases = [
              Image.open(folder / "child-lake-basin-review.png").convert("RGB")
              for folder in (loose, strict)
          ]
          width = 1400
          thumbs = []
          for pic in canvases:
              thumbs.append(pic.resize(
                  (width, round(pic.height * width / pic.width)),
                  Image.Resampling.LANCZOS
              ))
          sheet = Image.new(
              "RGB", (width, sum(x.height for x in thumbs) + 80), "#eee8da"
          )
          draw = ImageDraw.Draw(sheet)
          y = 0
          for im in thumbs:
              sheet.paste(im, (0, y))
              y += im.height + 40
          sheet.save(base / "child-lake-threshold-comparison.png")
          print("P2-B2.1 SENSITIVITY: strong thresholds cannot invent more basins")
          PY

      - name: Render explicit one-basin synthetic Core lake reference
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          from scripts.audit_planetary_child_lakes_v02 import (
              audit_child_depressions, render_lake_review
          )

          rows = cols = 21
          dem = np.empty((rows, cols), dtype=float)
          for row in range(rows):
              y = rows - row - .5
              for col in range(cols):
                  x = col + .5
                  dem[row, col] = 200.0 - .8 * x + .03 * (y - 10.5)**2
          dem[8:13, 8:13] -= 18.0
          child = {
              "child_elevation_m": dem,
              "land_mask": np.ones((rows, cols), dtype=np.uint8),
              "east_km": np.arange(cols, dtype=float),
              "north_km_north_first": np.arange(rows - 1, -1, -1, dtype=float),
          }
          fields, note = audit_child_depressions(
              child, lake_min_area_km2=2, lake_min_depth_m=1
          )
          assert note["threshold_qualified_basins"] == 1
          assert note["candidate_spill_count"] == 1
          assert note["small_grid_core_supernode_area_ledger"]["passed"]
          output = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint" / "child-lake-bowl-fixture"
          output.mkdir()
          np.savez_compressed(output / "basin-fields.npz", **fields)
          (output / "manifest.json").write_text(json.dumps(note, indent=2))
          render_lake_review(child, fields, note, output / "one-basin-reference.png")
          print("P2-B2.1 SMALL CORE LAKE: candidate spill and exact supernode mass balance")
          PY


      - name: P2-B2.2 map ORIGINAL macro A8 river-entry candidates with ZERO invented outside input
        run: |
          python scripts/condition_planetary_child_boundary_mfd_v02.py \
            --child-npz "$RUNNER_TEMP/source-geogrid-checkpoint/child/child-terrain-generated.npz" \
            --child-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/child/manifest.json" \
            --macro-npz "$RUNNER_TEMP/source-geogrid-checkpoint/macro-region-source.npz" \
            --lake-min-area-km2 16 --lake-min-depth-m 10 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/boundary-no-external"

      - name: P2-B2.2 explicit HYPOTHETICAL external catchment and distinct ledger
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          from scripts.condition_planetary_child_boundary_mfd_v02 import source_inlet_candidates
          base = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint"
          with np.load(base / "macro-region-source.npz", allow_pickle=False) as z:
              macro = {k:z[k] for k in z.files}
          with np.load(base / "child" / "child-terrain-generated.npz", allow_pickle=False) as z:
              child = {k:z[k] for k in z.files}
          child_manifest = json.loads((base / "child" / "manifest.json").read_text())
          sites = source_inlet_candidates(macro, child, child_manifest)
          print("Only A8 D8 prospective geometry:",len(sites))
          assert len(sites) >= 1, "synthetic fixture must have incoming macro segment"
          spec = {
              "schema":"P2_B2_2_EXPLICIT_A8_INFLOW_SCENARIO",
              "inflows":[{
                  "source_link_key":sites[0]["key"],
                  "external_area_km2":250.0,
                  "area_semantics":"EXTERNAL_ONLY_AREA_EXCLUDING_CHILD",
                  "operator_note":"SYNTHETIC HYPOTHESIS ONLY, deliberately not the old macro catchment value"
              }]
          }
          (base/"hypothetical-external.json").write_text(json.dumps(spec,indent=2))
          PY
          python scripts/condition_planetary_child_boundary_mfd_v02.py \
            --child-npz "$RUNNER_TEMP/source-geogrid-checkpoint/child/child-terrain-generated.npz" \
            --child-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/child/manifest.json" \
            --macro-npz "$RUNNER_TEMP/source-geogrid-checkpoint/macro-region-source.npz" \
            --inflows-json "$RUNNER_TEMP/source-geogrid-checkpoint/hypothetical-external.json" \
            --lake-min-area-km2 16 --lake-min-depth-m 10 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/boundary-external-hypothesis"

      - name: Assert no double counting, lake status and scenario graphics
        run: |
          python - <<'PY'
          import json,os
          import numpy as np
          from pathlib import Path
          from PIL import Image,ImageDraw
          b=Path(os.environ["RUNNER_TEMP"])/"source-geogrid-checkpoint"
          p=json.loads((b/"boundary-no-external"/"manifest.json").read_text())
          q=json.loads((b/"boundary-external-hypothesis"/"manifest.json").read_text())
          assert p["external_inflow"]["injected_external_area_km2"]==0
          assert q["external_inflow"]["injected_external_area_km2"]==250
          assert q["source_A8_D8_candidate_count"]>=1
          assert not q["lake_topology"]["actual_water_lakes_inferred"]
          assert q["river_network_consistency_with_macro"]=="NOT YET VALIDATED"
          assert abs(p["area_mass_ledger"]["balance_error_km2"])<1e-6
          assert abs(q["area_mass_ledger"]["balance_error_km2"])<1e-6
          with np.load(b/"boundary-no-external"/"boundary-routing-diagnostic.npz",allow_pickle=False) as a, \
               np.load(b/"boundary-external-hypothesis"/"boundary-routing-diagnostic.npz",allow_pickle=False) as c:
              x=a["mfd_contributing_area_with_explicit_inflows_km2"]
              y=c["mfd_contributing_area_with_explicit_inflows_km2"]
              assert x.shape==(131,171)
              assert np.max(y-x)>50
          imgs=[Image.open(b/f/"boundary-routing-preview.png").convert("RGB")
                for f in ("boundary-no-external","boundary-external-hypothesis")]
          w=1300
          thumb=[im.resize((w,round(im.height*w/im.width))) for im in imgs]
          panel=Image.new("RGB",(w,sum(t.height for t in thumb)+70),"#f1eade")
          at=0
          for t in thumb:
              panel.paste(t,(0,at))
              at+=t.height+35
          panel.save(b/"boundary-comparison-zero-vs-explicit-scenario.png")
          print("P2-B2.2: no invented macro area; +250 km2 explicit source, area ledger conserved")
          PY

      - name: P2-B2.3 original GLOBAL D8 first-entry partition (synthetic, re-entry-safe)
        run: |
          python scripts/trace_a8_external_first_entry_v02.py \
            --global-a8 "$RUNNER_TEMP/synthetic-world/A8.zip" \
            --macro-npz "$RUNNER_TEMP/source-geogrid-checkpoint/macro-region-source.npz" \
            --child-npz "$RUNNER_TEMP/source-geogrid-checkpoint/child/child-terrain-generated.npz" \
            --child-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/child/manifest.json" \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/first-entry-global"

      - name: Validate GLOBAL first-entry provenance and no automatic MFD injection
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          base = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint"
          result = json.loads((base / "first-entry-global/manifest.json").read_text())
          assert result["status"] == "A8_GLOBAL_FIRST_ENTRY_MACRO_AREA_VERIFIED_NOT_CHILD_MFD"
          assert result["full_global_D8_cycle_free"]
          assert result["no_source_cell_counted_twice"]
          assert result["original_A8_source_cells_partitioned_once"]
          assert result["auto_injected_external_area_km2"] == 0
          assert result["all_directed_external_area_km2"] >= result["old_A8_major_river_entry_area_km2"]
          assert result["old_A8_major_river_inlets_matched"] >= 1
          assert result["genuine_child_MFD_topology_validated"] is False
          with np.load(base / "first-entry-global/a8-first-entry-preview-crop.npz", allow_pickle=False) as f:
              assert f["first_entry_source_id"].ndim == 2
          print("P2-B2.3: synthetic full A8 graph SOURCE PARTITION ONLY, child automatic inflow=0")
          PY

      - name: P2-B2.4 compare original macro river EXITS to connected Core MFD child terminal paths
        run: |
          python scripts/compare_planetary_child_mfd_outlets_v02.py \

name: non-earth-geogrid-source-adapter-v02
on:
  push:
    branches: [feature/v0.2-planetary-geogrid-source-adapter]
  pull_request:
    paths:
      - scripts/export_planetary_macro_region_v02.py
      - tests/test_planetary_geogrid_source_adapter_v02.py
      - scripts/condition_planetary_child_terrain_v02.py
      - tests/test_planetary_child_terrain_v02.py
      - .github/workflows/non-earth-geogrid-source-adapter-v02.yml
permissions:
  contents: read
jobs:
  source-align-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and rendering environment
        run: python -m pip install -e ".[dev,render]"
      - name: Test source alignment and geographic graph boundary invariants
        run: python -m pytest tests/test_planetary_geogrid_source_adapter_v02.py tests/test_planetary_child_terrain_v02.py -q
      - name: Create SMALL synthetic source archives (NO PRIVATE PLANET DATA)
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import numpy as np
          import os
          from zipfile import ZipFile
          root = Path(os.environ["RUNNER_TEMP"]) / "synthetic-world"
          root.mkdir()
          lat = np.round(np.arange(-1.5, 1.5001, 0.3), 2).astype("float32")
          lon = np.round(np.arange(-3, 3.0001, 0.3), 2).astype("float32")
          rows, cols = len(lat), len(lon)
          X, Y = np.meshgrid(lon, lat)
          elevation = (380 + 150 * np.sin(X * 1.4) +
                       300 * np.exp(-((X - 1) ** 2 + (Y + 0.3) ** 2)) -
                       130 * np.cos(Y * 1.3)).astype("float32")
          land = np.ones((rows, cols), dtype="uint8")
          land[-2:, -3:] = 0
          north_elev = elevation[::-1].copy()
          north_land = land[::-1].copy()
          downstream = np.full((rows, cols), -1, dtype="int32")
          for row in range(rows - 1):
              downstream[row] = np.arange((row + 1) * cols, (row + 2) * cols)
          for name, member, fields in (
              ("A8", "planet_A8/A8_hydrology.npz", {
                  "lat": lat[::-1], "lon": lon,
                  "land": north_land, "elevation_m": north_elev,
                  "downstream_index": downstream,
                  "catchment_area_km2": np.abs(1 + 20 * X + 50 * Y).astype("float32"),
                  "river_mask": np.asarray(np.abs(X) < 0.2, dtype="uint8"),
              }),
              ("A12", "planet_A12/A12_biome_fields.npz", {
                  "lat": lat, "lon": lon, "land": land, "elevation_m": elevation,
                  "temperature_annual_C": np.full_like(elevation, 15),
                  "precip_planet_year_mm": np.full_like(elevation, 870),
                  "biome_base": np.full_like(land, 7),
              }),
              ("A10", "planet_A10/A10_water_balance.npz", {
                  "lat": lat, "lon": lon, "land": land,
                  "annual_Q_m3s": np.full_like(elevation, 50),
              }),
          ):
              data = BytesIO()
              np.savez_compressed(data, **fields)
              with ZipFile(root / f"{name}.zip", "w") as z:
                  z.writestr(member, data.getvalue())
          print("Synthetic input only:", [f.name for f in root.iterdir()])
          PY
      - name: Produce synthetic macro-region and preserve source graph boundary
        run: |
          python scripts/export_planetary_macro_region_v02.py \
            --a8 "$RUNNER_TEMP/synthetic-world/A8.zip" \
            --a12 "$RUNNER_TEMP/synthetic-world/A12.zip" \
            --a10 "$RUNNER_TEMP/synthetic-world/A10.zip" \
            --lat 0.0 --lon 0.0 \
            --half-width-km 180 --half-height-km 130 \
            --planet-radius-km 7008.1 \
            --planet-year-earth-days 202.755 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint"
      - name: Verify north-first raster, graph exits and output PNG
        run: |
          python - <<'PY'
          import json, os
          import numpy as np
          from pathlib import Path
          from PIL import Image
          out = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint"
          r = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          assert not r["is_DomainData"]
          assert r["source_precip_unit"] == "mm per planetary year"
          assert r["global_D8_receiver_index_preserved"]
          assert r["local_D8_exits_region_count"] > 0
          assert r["planet_radius_km"] == 7008.1
          with np.load(out / "macro-region-source.npz", allow_pickle=False) as f:
              assert f["elevation_m"].shape == tuple(r["region_shape"])
              assert f["latitude_deg_north_first"][0] > f["latitude_deg_north_first"][-1]
              assert np.any(f["source_downstream_exits_region"])
          with Image.open(out / "macro-region-preview.png") as image:
              assert image.width > 800 and image.height > 300
          print("SOURCE ADAPTER OK: aligned source raster, cropped D8 boundary noted")
          PY
      - name: Generate NEW 1-km child relief from synthetic macro source
        run: |
          python scripts/condition_planetary_child_terrain_v02.py \
            --macro-npz "$RUNNER_TEMP/source-geogrid-checkpoint/macro-region-source.npz" \
            --macro-manifest "$RUNNER_TEMP/source-geogrid-checkpoint/manifest.json" \
            --lat 0 --lon 0 \
            --half-width-km 85 --half-height-km 65 --spacing-km 1 \
            --seed 1406 --relief-strength 2 \
            --output "$RUNNER_TEMP/source-geogrid-checkpoint/child"

      - name: Verify exact source anchors, nontrivial detail and new PNG
        run: |
          python - <<'PY'
          import json, os
          import numpy as np
          from pathlib import Path
          from PIL import Image
          path = Path(os.environ["RUNNER_TEMP"]) / "source-geogrid-checkpoint" / "child"
          note = json.loads((path / "manifest.json").read_text(encoding="utf-8"))
          assert note["is_accepted_Core_DomainData"] is False
          assert note["max_parent_anchor_error_m"] < 1e-6
          assert note["source_elevation_anchors_in_child"] >= 6
          assert note["planet_year_earth_days"] == 202.755
          with np.load(path / "child-terrain-generated.npz", allow_pickle=False) as arr:
              assert arr["child_elevation_m"].shape == tuple(note["child_shape"])
              assert np.max(np.abs(arr["new_local_relief_m"])) > 1
              assert np.array_equal(arr["child_elevation_m"] >= 0,
                                    arr["parent_interpolated_m"] >= 0)
          with Image.open(path / "child-terrain-preview.png") as png:
              assert png.width > 800
          print("NON-EARTH CHILD: synthetic relief nontrivial; parent anchors exact")
          PY
      - name: Upload only synthetic adapter demonstration
        uses: actions/upload-artifact@v4
        with:
          name: non-earth-geogrid-synthetic-demo
          path: ${{ runner.temp }}/source-geogrid-checkpoint
          if-no-files-found: error
          retention-days: 14

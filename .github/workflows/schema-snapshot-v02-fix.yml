name: schema-snapshot-v02-fix

on:
  push:
    branches:
      - "fix/v0.2-domain-provenance"
    paths:
      - "src/domain_generator/contracts/**"
      - "src/domain_generator/schema_export.py"
      - ".github/workflows/schema-snapshot-v02-fix.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/v0.2-domain-provenance"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m domain_generator.schema_export
      - name: Commit generated snapshots when changed
        run: |
          if [ -z "$(git status --porcelain -- schemas/v0.2)" ]; then
            echo "schema snapshots already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/v0.2
          git commit -m "chore: refresh Core 0.2 schema snapshots"
          git push origin HEAD:fix/v0.2-domain-provenance

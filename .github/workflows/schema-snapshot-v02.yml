name: schema-snapshot-v02

on:
  pull_request:
    paths:
      - "src/domain_generator/contracts/**"
      - "src/domain_generator/schema_export.py"
      - ".github/workflows/schema-snapshot-v02.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m domain_generator.schema_export
      - uses: actions/upload-artifact@v4
        with:
          name: schema-snapshots-v02
          path: schemas/v0.2
          if-no-files-found: error
          retention-days: 1

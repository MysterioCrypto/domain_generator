name: cleanup-remote-generation

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-temporary-branch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'remote-generation/') &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.ref != github.event.pull_request.base.ref
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed remote-generation branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Deleting temporary generation branch: $HEAD_REF"
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$HEAD_REF"

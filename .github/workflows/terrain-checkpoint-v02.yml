name: terrain-checkpoint-v02

on:
  push:
    branches:
      - "impl/v0.2-continuous-terrain-foundation"
    paths:
      - "src/domain_generator/**"
      - "examples/terrain-v02/checkpoint/**"
      - "scripts/render_terrain_checkpoint_v02.py"
      - ".github/workflows/terrain-checkpoint-v02.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "impl/v0.2-continuous-terrain-foundation"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,render]"
      - name: Generate terrain-only checkpoint
        run: |
          python scripts/render_terrain_checkpoint_v02.py \
            examples/terrain-v02/checkpoint/request.json \
            examples/terrain-v02/checkpoint/presets.json \
            out/terrain-checkpoint-v02
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-checkpoint-v02
          path: out/terrain-checkpoint-v02
          if-no-files-found: error
          retention-days: 7
